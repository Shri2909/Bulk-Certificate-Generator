[project]
name = "certgen"
version = "1.0.0"
description = "Bulk certificate generator API"
requires-python = ">=3.11"  # enum.StrEnum

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# A typo like @pytest.mark.reqs becomes an error instead of silently hiding a requirement.
addopts = ["--strict-markers"]
markers = [
    "req(*ids): links a test to requirement IDs in docs/REQUIREMENTS.md",
    "slow: subprocess tests (run by default; deselect with -m 'not slow' for the fast loop)",
]
# A hung subprocess or deadlocked thread fails the test instead of hanging the suite.
timeout = 60

[tool.ruff]
line-length = 110
target-version = "py311"
# docs/ holds frozen specs whose code blocks are illustrative, not source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# ReportLab ships no type information.
module = ["reportlab.*"]
ignore_missing_imports = true
